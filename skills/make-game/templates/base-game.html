<!DOCTYPE html>
<!--
  SayMake 小游戏骨架（视觉标准见 data/conventions.json → visual）
  三段结构：样式区 / 结构区 / 逻辑区。修改时只动对应区块，不要重排其他部分。
  契约（不能删）：
    data-sm="start"    开始按钮
    data-sm="score"    分数显示，初始文本 0
    data-sm="restart"  重开按钮
    window.__sm = { start, restart, getScore, isRunning }
  主角用内联 SVG 画，不用 emoji。
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{游戏名}}</title>
<style>
  /* ========== 样式区 ========== */
  :root {
    /* 配色：从 visual.presets 里选一个，把值填进来 */
    --bg: linear-gradient(180deg, #FFF6EA 0%, #FFE3EC 100%);
    --accent: #FF5C8A;
    --accent2: #FFB627;
    --ink: #2B2140;
    --ink-soft: rgba(43, 33, 64, .6);
    --panel: rgba(255, 255, 255, .72);
    --ease: cubic-bezier(.2, .9, .3, 1.2);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: ui-rounded, -apple-system, "SF Pro Rounded", "PingFang SC", "Helvetica Neue", sans-serif;
    overflow: hidden; user-select: none; touch-action: none;
  }
  #app { position: relative; height: 100%; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; }

  /* 顶部：胶囊信息卡 */
  .hud { display: flex; justify-content: space-between; gap: 8px; padding: 14px 16px 6px; z-index: 2; }
  .pill {
    background: var(--panel); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-radius: 999px; padding: 8px 16px; font-weight: 800; font-size: 22px;
    font-variant-numeric: tabular-nums; box-shadow: 0 6px 20px rgba(43, 33, 64, .08);
    transition: transform .2s var(--ease);
  }
  .pill small { display: block; font-size: 11px; font-weight: 600; color: var(--ink-soft); letter-spacing: .04em; }
  .pill.bump { transform: scale(1.12); }

  #board { position: relative; flex: 1; overflow: hidden; }
  #board.shake { animation: shake .3s; }
  @keyframes shake { 0%,100% { transform: translateX(0) } 25% { transform: translateX(-8px) } 75% { transform: translateX(8px) } }

  /* 结算 / 开始：居中卡片 */
  .overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: 24px; z-index: 3; background: rgba(255, 255, 255, .35); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .card {
    width: 100%; max-width: 340px; background: #fff; border-radius: 28px; padding: 32px 28px;
    text-align: center; box-shadow: 0 20px 60px rgba(43, 33, 64, .18);
    animation: cardIn .35s var(--ease);
  }
  @keyframes cardIn { from { transform: scale(.9) translateY(12px); opacity: 0 } to { transform: none; opacity: 1 } }
  .card h1 { font-size: 40px; font-weight: 800; letter-spacing: -.02em; }
  .card p { font-size: 16px; font-weight: 500; line-height: 1.6; color: var(--ink-soft); margin-top: 10px; }
  .card .big { font-size: 64px; font-weight: 800; color: var(--accent); line-height: 1; margin: 16px 0 4px; font-variant-numeric: tabular-nums; }
  .card .stats { display: flex; justify-content: center; gap: 22px; margin: 14px 0 22px; font-size: 14px; font-weight: 600; color: var(--ink-soft); }
  .card .stats b { display: block; font-size: 20px; color: var(--ink); }
  .btn {
    display: block; width: 100%; height: 58px; border: 0; border-radius: 999px;
    background: var(--accent); color: #fff; font-size: 20px; font-weight: 800; cursor: pointer;
    box-shadow: 0 10px 24px rgba(255, 92, 138, .35); font-family: inherit;
    transition: transform .15s var(--ease), box-shadow .15s;
  }
  .btn:active { transform: scale(.96); box-shadow: 0 4px 12px rgba(255, 92, 138, .3); }
  .badge {
    display: inline-block; margin-top: 8px; padding: 6px 14px; border-radius: 999px;
    background: var(--accent2); color: #fff; font-size: 13px; font-weight: 800; letter-spacing: .04em;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <div class="hud">
    <div class="pill"><small>得分</small><span id="score" data-sm="score">0</span></div>
    <div class="pill"><small>时间</small><span id="timer">{{时间}}</span></div>
  </div>

  <div id="board">
    <!-- 游戏元素渲染在这里（内联 SVG） -->

    <div id="startScreen" class="overlay">
      <div class="card">
        <h1>{{游戏名}}</h1>
        <p>{{一句话说明怎么玩}}</p>
        <p style="margin-top:20px"><button class="btn" id="startBtn" data-sm="start">开始</button></p>
      </div>
    </div>

    <div id="overScreen" class="overlay hidden">
      <div class="card">
        <p>{{结束标题}}</p>
        <div class="big" id="finalScore">0</div>
        <div class="stats">
          <span>最高连击<b id="stat-combo">0</b></span>
          <span>历史最佳<b id="stat-best">0</b></span>
        </div>
        <span class="badge hidden" id="newRecord">新纪录！</span>
        <p style="margin-top:16px"><button class="btn" id="restartBtn" data-sm="restart">再来一局</button></p>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  // ========== 逻辑区 ==========
  const board = document.getElementById('board');
  const scoreEl = document.getElementById('score');

  const TOTAL = 60;
  let score = 0, running = false, timer = null;

  function start() {
    score = 0; running = true;
    scoreEl.textContent = '0';
    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('overScreen').classList.add('hidden');
    clearInterval(timer); timer = setInterval(tick, 1000);
    // TODO: 生成第一个游戏元素
  }
  function tick() {
    // TODO: 倒计时；到 0 调 end()
  }
  function onHit() {
    if (!running) return;
    score++; scoreEl.textContent = score;
    // TODO: 粒子 + 飘字 + 主角回弹
  }
  function end() {
    running = false; clearInterval(timer);
    document.getElementById('finalScore').textContent = score;
    document.getElementById('overScreen').classList.remove('hidden');
  }
  function restart() { start(); }
  function getScore() { return score; }
  function isRunning() { return running; }

  document.getElementById('startBtn').addEventListener('click', start);
  document.getElementById('restartBtn').addEventListener('click', restart);
  window.__sm = { start, restart, getScore, isRunning };
})();
</script>
</body>
</html>
