<!DOCTYPE html>
<!--
  SayMake 小游戏骨架（像素复古方向 pixel-retro，Game Boy 四色调色板）
  和 base-game.html 结构相同、契约相同，只是审美方向不同。用来证明：方向是选出来的，不是定死的。
  契约（不能删）：data-sm="start|score|restart"，window.__sm = { start, restart, getScore, isRunning }
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{游戏名}}</title>
<style>
  /* ========== 样式区（pixel-retro） ========== */
  :root { --d: #0f380f; --m: #306230; --l: #8bac0f; --p: #9bbc0f; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--p); color: var(--d);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, "PingFang SC", monospace;
    font-weight: 700; text-transform: uppercase; letter-spacing: .08em;
    overflow: hidden; user-select: none; touch-action: none;
    image-rendering: pixelated;
  }
  #app { height: 100%; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; border: 4px solid var(--d); }
  .hud { display: flex; justify-content: space-between; padding: 8px; font-size: 16px; border-bottom: 4px solid var(--d); background: var(--l); }
  #board { position: relative; flex: 1; overflow: hidden; background: var(--p); }
  .sprite { position: absolute; left: 0; top: 0; pointer-events: none; }
  .overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; background: var(--p); z-index: 3; }
  .card { width: 100%; border: 4px solid var(--d); background: var(--l); padding: 24px 16px; text-align: center; }
  .card h1 { font-size: 32px; line-height: 1.2; }
  .card p { font-size: 14px; line-height: 1.8; margin: 12px 0 20px; }
  .card .big { font-size: 48px; margin: 8px 0; }
  .btn {
    display: block; width: 100%; padding: 14px; border: 4px solid var(--d); background: var(--p);
    color: var(--d); font: inherit; font-size: 18px; cursor: pointer; box-shadow: 4px 4px 0 var(--d);
  }
  .btn:active { transform: translate(4px, 4px); box-shadow: none; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <div class="hud"><span>SCORE <b id="score" data-sm="score">0</b></span><span id="timer">{{时间}}</span></div>
  <div id="board">
    <!-- 像素精灵渲染在这里（box-shadow 像素画或 <rect> 拼的小方格 SVG） -->

    <div id="startScreen" class="overlay"><div class="card">
      <h1>{{游戏名}}</h1><p>{{一句话说明怎么玩}}</p>
      <button class="btn" id="startBtn" data-sm="start">START</button>
    </div></div>

    <div id="overScreen" class="overlay hidden"><div class="card">
      <p>TIME UP</p><div class="big" id="finalScore">0</div>
      <button class="btn" id="restartBtn" data-sm="restart">RETRY</button>
    </div></div>
  </div>
</div>
<script>
(() => {
  // ========== 逻辑区 ==========
  const scoreEl = document.getElementById('score');
  const TOTAL = 60;
  let score = 0, running = false, timer = null;
  function start() {
    score = 0; running = true; scoreEl.textContent = '0';
    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('overScreen').classList.add('hidden');
    clearInterval(timer); timer = setInterval(tick, 1000);
    // TODO: 第一个精灵
  }
  function tick() { /* TODO 倒计时，到 0 调 end() */ }
  function onHit() { if (!running) return; score++; scoreEl.textContent = score; }
  function end() {
    running = false; clearInterval(timer);
    document.getElementById('finalScore').textContent = score;
    document.getElementById('overScreen').classList.remove('hidden');
  }
  function restart() { start(); }
  function getScore() { return score; }
  function isRunning() { return running; }
  document.getElementById('startBtn').addEventListener('click', start);
  document.getElementById('restartBtn').addEventListener('click', restart);
  window.__sm = { start, restart, getScore, isRunning };
})();
</script>
</body>
</html>
