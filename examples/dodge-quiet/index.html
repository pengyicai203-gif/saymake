<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>别碰方块</title>
<style>
  :root { --bg: #FAFAFA; --ink: #111; --accent: #FF4D00; --line: #E6E6E6; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    font-size: 16px; font-weight: 500; line-height: 1.5;
    display: flex; justify-content: center; align-items: stretch;
    -webkit-tap-highlight-color: transparent; user-select: none; overflow: hidden;
  }
  .app { width: 100%; max-width: 480px; height: 100%; display: flex; flex-direction: column; padding: 16px 16px calc(12px + env(safe-area-inset-bottom)); border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
  header { display: flex; justify-content: space-between; align-items: flex-end; padding-bottom: 12px; border-bottom: 2px solid var(--ink); }
  h1 { font-size: 48px; font-weight: 900; line-height: 1; letter-spacing: -0.02em; }
  .meta { text-align: right; font-size: 16px; line-height: 1.2; }
  .meta small { display: block; font-size: 16px; }
  .meta b { font-size: 24px; font-weight: 900; }
  .meta b.new { color: var(--accent); }
  .stage { position: relative; flex: 1; min-height: 320px; margin-top: 12px; border: 2px solid var(--ink); overflow: hidden; cursor: pointer; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .bar { display: flex; justify-content: space-between; align-items: baseline; padding: 8px 0; font-size: 16px; line-height: 1.2; }
  .bar .label { margin-right: 8px; }
  #score { font-size: 32px; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
  .bar .right { display: flex; align-items: baseline; gap: 16px; }
  .bar[hidden] { display: none; }
  .right { text-align: right; }
  #phase { display: block; font-size: 16px; line-height: 1.2; }
  #lives { font-size: 20px; letter-spacing: 3px; line-height: 1.2; }
  #lives .off { color: var(--line); }
  .panel { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 16px; background: var(--bg); text-align: center; padding: 24px; }
  .panel[hidden] { display: none; }
  .panel h2 { font-size: 32px; font-weight: 900; line-height: 1.1; }
  .panel p { max-width: 280px; }
  .panel .big { font-size: 72px; font-weight: 900; line-height: 1; }
  button { min-width: 200px; min-height: 56px; border: 2px solid var(--ink); background: var(--ink); color: var(--bg); font: inherit; font-size: 20px; font-weight: 900; cursor: pointer; border-radius: 0; }
  button:active { background: var(--bg); color: var(--ink); }
  footer { padding-top: 10px; border-top: 1px solid var(--line); font-size: 16px; }
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>别碰方块</h1>
    <div class="meta"><small>最佳</small><b id="best">0</b></div>
  </header>

  <div class="bar" id="hud"><div><span class="label">得分</span><span id="score" data-sm="score">0</span></div><div class="right"><span id="phase">第 1 段</span><span id="lives" aria-label="剩余生命"></span></div></div>

  <section class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="panel" id="panel"></div>
  </section>

  <footer>切到别的窗口会自动暂停 · 没有声音</footer>
</main>

<script>
(() => {
  'use strict';
  const stage = document.getElementById('stage');
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const hud = document.getElementById('hud');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const phaseEl = document.getElementById('phase');
  const livesEl = document.getElementById('lives');
  const panel = document.getElementById('panel');

  const C = { bg: '#FAFAFA', ink: '#111', accent: '#FF4D00', line: '#E6E6E6' };
  const KEY = 'sm-dodge-best';
  let best = Number(localStorage.getItem(KEY) || 0) || 0;
  bestEl.textContent = best;

  let W = 0, H = 0, dpr = 1;
  function resize() {
    const r = stage.getBoundingClientRect();
    W = Math.round(r.width); H = Math.round(r.height);
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  // ---------- 状态 ----------
  const S = { running: false, paused: false, over: false, armed: false, t: 0, score: 0, lives: 3, phase: 1, inv: 0, lastOb: -99 };
  const P = { x: 0, y: 0, vy: 0, size: 30 };
  const OBST = [];   // { x, w, gapY, gapH, passed, hit }
  const POP = [];    // 飘字 { x, y, text, life }
  let sparks = [];   // 擦边闪一下的边 { top, y, life }

  function reset() {
    S.t = 0; S.score = 0; S.lives = 3; S.phase = 1; S.inv = 0; S.lastOb = -99; S.armed = false;
    OBST.length = 0; POP.length = 0; sparks = [];
    P.x = W / 3; P.y = H / 2; P.vy = 0;
    scoreEl.textContent = '0'; phaseEl.textContent = '第 1 段'; renderLives();
  }
  const gapRatio = () => Math.max(0.30, 0.38 - S.t * 0.0055);       // 热身：缝隙从 38% 收到 30%
  const speed = () => W * 0.45 * Math.min(1.5, 1 + (S.phase - 1) * 0.06);
  const spacing = () => 1.5;

  function renderLives() {
    livesEl.innerHTML = '';
    for (let i = 0; i < 3; i++) { const s = document.createElement('span'); s.textContent = '■'; if (i >= S.lives) s.className = 'off'; livesEl.appendChild(s); }
  }

  // ---------- 三个页面：开始 / 结束 / 暂停 ----------
  function showPanel(kind) {
    panel.hidden = false; hud.hidden = true;
    if (kind === 'start') {
      panel.innerHTML = '<h2>点一下，往上飞</h2><p>别碰方块，也别掉下去。共三条命。</p><button data-sm="start" id="btnStart">开始</button>';
      document.getElementById('btnStart').addEventListener('click', (e) => { e.stopPropagation(); start(); });
    } else if (kind === 'over') {
      const isNew = S.score > 0 && S.score >= best;
      panel.innerHTML = `<h2>${isNew ? '<span style="color:var(--accent)">新纪录</span>' : '本次'}</h2><div class="big">${S.score}</div><p>最佳 ${best}</p><button data-sm="restart" id="btnRestart">再来一局</button>`;
      document.getElementById('btnRestart').addEventListener('click', (e) => { e.stopPropagation(); restart(); });
    } else {
      panel.innerHTML = '<h2>已暂停</h2><p>刚才那局还在。</p><button id="btnResume">继续</button>';
      document.getElementById('btnResume').addEventListener('click', (e) => { e.stopPropagation(); resume(); });
    }
  }

  function start() { reset(); S.running = true; S.paused = false; S.over = false; panel.hidden = true; hud.hidden = false; last = performance.now(); requestAnimationFrame(loop); }
  function restart() { start(); }
  function pause() { if (!S.running || S.paused) return; S.paused = true; showPanel('pause'); }
  function resume() { if (!S.running || !S.paused) return; S.paused = false; panel.hidden = true; hud.hidden = false; last = performance.now(); requestAnimationFrame(loop); }
  function gameOver() {
    S.running = false; S.over = true;
    if (S.score > best) { best = S.score; localStorage.setItem(KEY, String(best)); bestEl.textContent = best; bestEl.classList.add('new'); }
    setTimeout(() => showPanel('over'), 350);
  }

  // ---------- 输入 ----------
  function flap() {
    if (!S.running || S.paused) return;
    if (!S.armed) { S.armed = true; S.t = 0; last = performance.now(); }   // 第一次点才开始下落，手指没到位不会白白丢命
    P.vy = -H * 0.78;
  }
  stage.addEventListener('pointerdown', (e) => { if (e.target.tagName !== 'BUTTON') flap(); });
  document.addEventListener('keydown', (e) => { if (e.code === 'Space') { e.preventDefault(); if (S.over) restart(); else if (S.paused) resume(); else flap(); } });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  window.addEventListener('blur', () => pause());

  // ---------- 逻辑 ----------
  function loop(now) {
    if (!S.running || S.paused) return;
    const dt = Math.min(0.033, (now - last) / 1000); last = now;
    step(dt); draw();
    requestAnimationFrame(loop);
  }
  let last = 0;

  function step(dt) {
    if (!S.armed) { P.y += (H / 2 - P.y) * Math.min(1, dt * 6); draw(); return; }
    S.t += dt;
    const sp = speed(), g = gapRatio(), gh = H * g;
    // 出方块：先给 2.5 秒热身
    if (S.t > 1.2 && S.t - S.lastOb >= spacing()) {
      S.lastOb = S.t;
      OBST.push({ x: W + 40, w: 34, gapY: 28 + Math.random() * (H - 56 - gh), gapH: gh, passed: false, hit: false, near: false });
    }
    P.vy += H * 2.6 * dt; P.y += P.vy * dt;
    // 边界：掉下去扣一条命；顶到上边只是顶住弹回，不扣命（顶一下不算撞）
    if (P.y < 0) { P.y = 0; P.vy = H * 0.25; }
    else if (P.y > H - P.size) {
      P.y = H - P.size; P.vy = -H * 0.5;
      loseLife();
    }
    let minEdge = Infinity;
    for (const o of OBST) {
      o.x -= sp * dt;
      const topH = o.gapY, botY = o.gapY + o.gapH;
      // 碰撞
      if (!o.hit && S.inv <= 0 && P.x + P.size > o.x && P.x < o.x + o.w && (P.y < topH || P.y + P.size > botY)) {
        o.hit = true; loseLife();
      }
      // 计分与擦边
      if (!o.passed && o.x + o.w < P.x) {
        o.passed = true;
        S.score += 1;
        const edge = Math.min(P.y - topH, botY - (P.y + P.size));
        if (edge < H * 0.05 && !o.hit) { S.score += 2; POP.push({ x: P.x + 40, y: P.y, text: '+2 险', life: 0.8 }); sparks.push({ o, life: 0.25 }); }
        scoreEl.textContent = String(S.score);
        const ph = 1 + Math.floor(S.score / 10);
        if (ph !== S.phase) { S.phase = ph; phaseEl.textContent = `第 ${ph} 段`; }
      }
    }
    for (let i = OBST.length - 1; i >= 0; i--) if (OBST[i].x < -80) OBST.splice(i, 1);
    if (S.inv > 0) S.inv -= dt;
    for (let i = POP.length - 1; i >= 0; i--) { POP[i].life -= dt; POP[i].y -= 40 * dt; if (POP[i].life <= 0) POP.splice(i, 1); }
    for (let i = sparks.length - 1; i >= 0; i--) { sparks[i].life -= dt; if (sparks[i].life <= 0) sparks.splice(i, 1); }
  }

  function loseLife() {
    if (S.inv > 0) return;
    S.lives -= 1; S.inv = 1.2; renderLives();
    POP.push({ x: P.x + 40, y: P.y, text: '-1', life: 0.8 });
    if (S.lives <= 0) gameOver();
  }

  // ---------- 画 ----------
  function draw() {
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
    // 细线网格，让它像个小工具
    ctx.strokeStyle = C.line; ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 32) { ctx.beginPath(); ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, H); ctx.stroke(); }
    // 方块
    ctx.fillStyle = C.ink;
    for (const s of sparks) { const o = s.o; ctx.fillStyle = C.ink; ctx.fillRect(o.x, o.gapY, o.w, 6); ctx.fillRect(o.x, o.gapY + o.gapH - 6, o.w, 6); }
    for (const o of OBST) {
      const topH = o.gapY, botY = o.gapY + o.gapH;
      ctx.fillStyle = C.ink;
      ctx.fillRect(o.x, 0, o.w, topH);
      ctx.fillRect(o.x, botY, o.w, H - botY);
    }
    // 主角：唯一用强调色的元素
    const blink = S.inv > 0 && Math.floor(S.inv * 10) % 2 === 0;
    ctx.fillStyle = blink ? C.bg : C.accent;
    ctx.fillRect(P.x, P.y, P.size, P.size);
    ctx.strokeStyle = C.ink; ctx.lineWidth = 2; ctx.strokeRect(P.x + 1, P.y + 1, P.size - 2, P.size - 2);
    if (S.running && !S.armed) { ctx.fillStyle = C.ink; ctx.font = '500 16px -apple-system, "PingFang SC", "Helvetica Neue", sans-serif'; ctx.textAlign = 'center'; ctx.fillText('点一下屏幕，开始下落', W / 2, H / 2 + 48); ctx.textAlign = 'left'; }
    // 飘字
    ctx.fillStyle = C.ink; ctx.font = '900 20px -apple-system, "PingFang SC", "Helvetica Neue", sans-serif'; ctx.textAlign = 'left';
    for (const p of POP) ctx.fillText(p.text, p.x, p.y);
    // 暂停时的静态画面上叠一条线，表示"停住了"
    if (S.paused) { ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H); }
  }

  // ---------- 给验收器用的 ----------
  window.__sm = {
    start, restart,
    getScore: () => S.score,
    isRunning: () => S.running && !S.paused,
  };

  resize();
  window.addEventListener('resize', () => { resize(); if (!S.running) { P.x = W / 3; P.y = H / 2; } });
  showPanel('start');
})();
</script>
</body>
</html>
