<!DOCTYPE html>
<!--
  SayMake 示例：接水果
  用户当时说的那句话："做一个在手机上玩的水果接取小游戏。"
  三段结构：样式区 / 结构区 / 逻辑区。修改时只动对应区块。
  契约：data-sm="start|score|restart"，window.__sm = { start, restart, getScore, isRunning }
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>接水果</title>
<style>
  /* ========== 样式区 ========== */
  :root {
    --bg-top: #ffe9c7;
    --bg-bottom: #ffb26b;
    --fg: #4a2c0f;
    --accent: #ff7a3d;
    --danger: #e63946;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: linear-gradient(var(--bg-top), var(--bg-bottom));
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    overflow: hidden; user-select: none; touch-action: none;
  }
  #app { position: relative; height: 100%; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; font-size: 20px; font-weight: 700; z-index: 2; }
  header b { font-size: 26px; color: var(--accent); }
  #timer { font-variant-numeric: tabular-nums; }
  #board { position: relative; flex: 1; overflow: hidden; }
  #board.shake { animation: shake .3s; }
  @keyframes shake { 0%,100% { transform: translateX(0) } 25% { transform: translateX(-8px) } 75% { transform: translateX(8px) } }
  .fruit { position: absolute; left: 0; top: 0; font-size: 44px; line-height: 1; will-change: transform; pointer-events: none; }
  #basket { position: absolute; bottom: 14px; left: 0; font-size: 60px; line-height: 1; will-change: transform; pointer-events: none; filter: drop-shadow(0 6px 4px rgba(0,0,0,.18)); }
  .pop { position: absolute; font-size: 22px; font-weight: 800; color: var(--accent); pointer-events: none; animation: rise .5s ease-out forwards; }
  .pop.bad { color: var(--danger); }
  @keyframes rise { from { opacity: 1; transform: translateY(0) } to { opacity: 0; transform: translateY(-40px) } }
  #flash { position: absolute; inset: 0; background: var(--danger); opacity: 0; pointer-events: none; }
  #flash.on { animation: flash .25s; }
  @keyframes flash { from { opacity: .35 } to { opacity: 0 } }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: rgba(255, 233, 199, .9); text-align: center; padding: 24px; z-index: 3; }
  .overlay h1 { font-size: 36px; }
  .overlay p { font-size: 17px; line-height: 1.6; }
  .overlay .big { font-size: 28px; font-weight: 800; color: var(--accent); }
  .btn { min-width: 200px; padding: 16px 28px; border: 0; border-radius: 999px; background: var(--accent); color: #fff; font-size: 22px; font-weight: 800; cursor: pointer; box-shadow: 0 6px 0 #c9501a; }
  .btn:active { transform: translateY(3px); box-shadow: 0 3px 0 #c9501a; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <header><span>得分 <b id="score" data-sm="score">0</b></span><span id="timer">60</span></header>

  <div id="board">
    <div id="flash"></div>
    <div id="basket">🧺</div>

    <div id="startScreen" class="overlay">
      <h1>接水果</h1>
      <p>手指左右滑动，移动篮子接住掉下来的水果。<br>接到一个 +1 分，炸弹别接，接到 −3 分。<br>60 秒，看你能接多少。</p>
      <button class="btn" id="startBtn" data-sm="start">开始</button>
    </div>

    <div id="overScreen" class="overlay hidden">
      <p>时间到！你接到</p>
      <div class="big" id="finalScore">0</div>
      <button class="btn" id="restartBtn" data-sm="restart">再来一局</button>
    </div>
  </div>
</div>

<script>
(() => {
  // ========== 逻辑区 ==========
  const board = document.getElementById('board');
  const basket = document.getElementById('basket');
  const scoreEl = document.getElementById('score');
  const timerEl = document.getElementById('timer');
  const startScreen = document.getElementById('startScreen');
  const overScreen = document.getElementById('overScreen');
  const finalScore = document.getElementById('finalScore');
  const flash = document.getElementById('flash');

  const FRUITS = ['🍎', '🍌', '🍇', '🍓', '🍊', '🍉', '🍑', '🥝'];
  const BOMB = '💣';
  const TOTAL = 60;          // 一局秒数
  const FRUIT_SIZE = 44;
  const BASKET_SIZE = 60;
  const BOMB_PENALTY = 3;

  let score = 0, running = false, raf = null;
  let fruits = [], basketX = 0, catchY = 0, elapsed = 0, lastT = 0, spawnIn = 0, shownLeft = -1;

  function measure() {
    const r = board.getBoundingClientRect();
    catchY = r.height - BASKET_SIZE - 14 - 8;
    if (!basketX) basketX = r.width / 2;
    basketX = Math.max(BASKET_SIZE / 2, Math.min(r.width - BASKET_SIZE / 2, basketX));
    drawBasket();
  }
  function drawBasket() { basket.style.transform = `translate(${basketX - BASKET_SIZE / 2}px, 0)`; }

  function spawn() {
    const r = board.getBoundingClientRect();
    const isBomb = elapsed > 5 && Math.random() < 0.22;
    const el = document.createElement('div');
    el.className = 'fruit';
    el.textContent = isBomb ? BOMB : FRUITS[Math.floor(Math.random() * FRUITS.length)];
    const x = FRUIT_SIZE / 2 + 10 + Math.random() * (r.width - FRUIT_SIZE - 20);
    const f = { el, x, y: -FRUIT_SIZE, vy: 220 + Math.random() * 80, bomb: isBomb };
    el.style.transform = `translate(${x - FRUIT_SIZE / 2}px, ${f.y}px)`;
    board.appendChild(el);
    fruits.push(f);
  }

  function popText(x, y, text, bad) {
    const el = document.createElement('div');
    el.className = 'pop' + (bad ? ' bad' : '');
    el.textContent = text;
    el.style.left = (x - 12) + 'px'; el.style.top = (y - 30) + 'px';
    board.appendChild(el);
    setTimeout(() => el.remove(), 500);
  }

  function catchIt(f) {
    if (f.bomb) {
      score = Math.max(0, score - BOMB_PENALTY);
      popText(f.x, catchY, '-' + BOMB_PENALTY, true);
      flash.classList.remove('on'); void flash.offsetWidth; flash.classList.add('on');
      board.classList.remove('shake'); void board.offsetWidth; board.classList.add('shake');
    } else {
      score++;
      popText(f.x, catchY, '+1', false);
    }
    scoreEl.textContent = score;
  }

  function loop(t) {
    if (!running) return;
    const dt = Math.min(0.05, (t - lastT) / 1000 || 0);
    lastT = t; elapsed += dt;
    const speedUp = 1 + (elapsed / TOTAL) * 1.3;

    spawnIn -= dt;
    if (spawnIn <= 0) {
      spawn();
      spawnIn = Math.max(0.45, 1.1 - (elapsed / TOTAL) * 0.6);
    }

    const H = board.getBoundingClientRect().height;
    for (let i = fruits.length - 1; i >= 0; i--) {
      const f = fruits[i];
      f.y += f.vy * speedUp * dt;
      f.el.style.transform = `translate(${f.x - FRUIT_SIZE / 2}px, ${f.y}px)`;
      const caught = Math.abs(f.x - basketX) <= (BASKET_SIZE / 2 + FRUIT_SIZE / 2 - 6);
      if (caught && f.y + FRUIT_SIZE / 2 >= catchY) { catchIt(f); f.el.remove(); fruits.splice(i, 1); }
      else if (f.y - FRUIT_SIZE / 2 > H) { f.el.remove(); fruits.splice(i, 1); }
    }

    const left = Math.max(0, TOTAL - Math.floor(elapsed));
    if (left !== shownLeft) { shownLeft = left; timerEl.textContent = left; }
    if (elapsed >= TOTAL) return end();
    raf = requestAnimationFrame(loop);
  }

  function clearFruits() { fruits.forEach(f => f.el.remove()); fruits = []; }

  function start() {
    clearFruits();
    score = 0; elapsed = 0; spawnIn = 0.3; shownLeft = -1; running = true;
    scoreEl.textContent = '0'; timerEl.textContent = TOTAL;
    startScreen.classList.add('hidden'); overScreen.classList.add('hidden');
    measure();
    lastT = performance.now();
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(loop);
  }
  function end() {
    running = false; cancelAnimationFrame(raf); clearFruits();
    finalScore.textContent = score; overScreen.classList.remove('hidden');
  }
  function restart() { start(); }
  function getScore() { return score; }
  function isRunning() { return running; }

  function moveBasket(e) {
    const r = board.getBoundingClientRect();
    basketX = e.clientX - r.left;
    basketX = Math.max(BASKET_SIZE / 2, Math.min(r.width - BASKET_SIZE / 2, basketX));
    drawBasket();
  }
  board.addEventListener('pointerdown', moveBasket);
  board.addEventListener('pointermove', (e) => { if (e.buttons || e.pointerType === 'touch') moveBasket(e); });
  window.addEventListener('resize', measure);

  document.getElementById('startBtn').addEventListener('click', start);
  document.getElementById('restartBtn').addEventListener('click', restart);
  measure();

  // 契约：验收器依赖这四个方法
  window.__sm = { start, restart, getScore, isRunning };
})();
</script>
</body>
</html>
