<!DOCTYPE html>
<!--
  SayMake 示例：接水果（v3，方向：写实清爽 realistic-clean）
  用户原话："做一个在手机上玩的水果接取小游戏。"
  用户第三轮回答："我想要的感觉是更真实：背景色彩更简单，水果和篮子更真实。
                   玩完一局，想看到分数破纪录、放松解压、和朋友间比一比。"
  三段结构：样式区 / 结构区 / 逻辑区。修改时只动对应区块。
  契约：data-sm="start|score|restart"，window.__sm = { start, restart, getScore, isRunning }
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>接水果</title>
<style>
  /* ========== 样式区（realistic-clean：一色背景，真实感的物体） ========== */
  :root {
    --bg: linear-gradient(180deg, #F7F2EA 0%, #ECE4D6 100%);
    --ink: #2A2520;
    --ink-soft: rgba(42, 37, 32, .55);
    --accent: #E0533D;
    --accent2: #F2B33D;
    --panel: rgba(255, 255, 255, .82);
    --danger: #C8372D;
    --ease: cubic-bezier(.2, .9, .3, 1.15);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: ui-rounded, -apple-system, "SF Pro Rounded", "PingFang SC", "Helvetica Neue", sans-serif;
    overflow: hidden; user-select: none; touch-action: none;
  }
  #app { position: relative; height: 100%; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; }

  .hud { display: flex; justify-content: space-between; gap: 8px; padding: 14px 16px 8px; z-index: 2; }
  .pill {
    flex: 1; text-align: center;
    background: var(--panel); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-radius: 20px; padding: 8px 12px 10px; font-weight: 800; font-size: 28px; line-height: 1.1;
    font-variant-numeric: tabular-nums; box-shadow: 0 8px 24px rgba(42, 37, 32, .10);
    transition: transform .2s var(--ease);
  }
  .pill small { display: block; font-size: 11px; font-weight: 700; color: var(--ink-soft); letter-spacing: .06em; margin-bottom: 2px; }
  .pill.bump { transform: scale(1.1); }
  .pill.combo.hot { background: var(--accent); color: #fff; }
  .pill.combo.hot small { color: rgba(255,255,255,.8); }
  .combo-track { height: 4px; margin: 0 16px; border-radius: 2px; background: rgba(42,37,32,.08); overflow: hidden; }
  .combo-track i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 2px; transition: width .25s var(--ease); }

  #board { position: relative; flex: 1; overflow: hidden; }
  #board::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(120% 80% at 50% 40%, transparent 60%, rgba(42,37,32,.06) 100%); }
  #board.shake { animation: shake .3s; }
  @keyframes shake { 0%,100% { transform: translateX(0) } 25% { transform: translateX(-6px) } 75% { transform: translateX(6px) } }
  #flash { position: absolute; inset: 0; background: var(--danger); opacity: 0; pointer-events: none; }
  #flash.on { animation: flash .3s; }
  @keyframes flash { from { opacity: .22 } to { opacity: 0 } }

  .fruit, #basket { position: absolute; left: 0; top: 0; line-height: 0; will-change: transform; pointer-events: none; }
  .fruit svg, #basket svg { display: block; }
  .fruit { filter: drop-shadow(0 8px 6px rgba(42, 37, 32, .22)); }
  #basket { filter: drop-shadow(0 12px 10px rgba(42, 37, 32, .22)); }
  .golden svg { filter: drop-shadow(0 0 6px rgba(242, 179, 61, .9)) drop-shadow(0 8px 6px rgba(42,37,32,.22)); }
  .spark { animation: sparkle .3s infinite alternate; transform-origin: center; }
  @keyframes sparkle { from { opacity: .6; transform: scale(.7) } to { opacity: 1; transform: scale(1.3) } }

  .p { position: absolute; width: 9px; height: 9px; border-radius: 50%; pointer-events: none; }
  .float {
    position: absolute; font-weight: 800; font-size: 24px; color: var(--accent); pointer-events: none;
    text-shadow: 0 1px 0 #fff; animation: rise .6s var(--ease) forwards; white-space: nowrap;
  }
  .float.bad { color: var(--danger); }
  .float.miss { color: var(--ink-soft); font-size: 16px; }
  @keyframes rise { from { opacity: 1; transform: translate(-50%, 0) scale(.6) } 30% { transform: translate(-50%, -10px) scale(1.15) } to { opacity: 0; transform: translate(-50%, -46px) scale(1) } }
  .toast {
    position: absolute; left: 50%; top: 18px; transform: translateX(-50%);
    background: var(--ink); color: #fff; font-weight: 800; font-size: 15px; padding: 8px 18px; border-radius: 999px;
    pointer-events: none; opacity: 0; z-index: 2;
  }

  .overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: 24px; z-index: 3; background: rgba(247, 242, 234, .55); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .card {
    width: 100%; max-width: 340px; background: #fff; border-radius: 24px; padding: 30px 26px 24px;
    text-align: center; box-shadow: 0 24px 60px rgba(42, 37, 32, .16);
    animation: cardIn .35s var(--ease);
  }
  @keyframes cardIn { from { transform: scale(.92) translateY(12px); opacity: 0 } to { transform: none; opacity: 1 } }
  .card h1 { font-size: 40px; font-weight: 800; letter-spacing: -.02em; }
  .card .lead { font-size: 16px; font-weight: 500; line-height: 1.6; color: var(--ink-soft); margin-top: 10px; }
  .card .lead b { color: var(--ink); }
  .card .big { font-size: 64px; font-weight: 800; color: var(--accent); line-height: 1; margin: 14px 0 4px; font-variant-numeric: tabular-nums; }
  .card .title { font-size: 22px; font-weight: 800; }
  .card .stats { display: flex; justify-content: center; gap: 28px; margin: 12px 0 16px; font-size: 13px; font-weight: 700; color: var(--ink-soft); }
  .card .stats b { display: block; font-size: 22px; color: var(--ink); margin-top: 2px; }
  .vs { display: flex; justify-content: center; align-items: center; gap: 18px; margin: 18px 0 8px; }
  .vs .side { font-size: 13px; font-weight: 700; color: var(--ink-soft); }
  .vs .side b { display: block; font-size: 40px; color: var(--ink); margin-top: 2px; }
  .vs .side.win b { color: var(--accent); }
  .vs .tag { font-size: 13px; font-weight: 800; color: var(--ink-soft); }
  .btn {
    display: block; width: 100%; height: 58px; border: 0; border-radius: 999px;
    background: var(--accent); color: #fff; font-size: 20px; font-weight: 800; cursor: pointer;
    box-shadow: 0 10px 24px rgba(224, 83, 61, .3); font-family: inherit;
    transition: transform .15s var(--ease), box-shadow .15s; margin-top: 10px;
  }
  .btn:active { transform: scale(.96); box-shadow: 0 4px 12px rgba(224, 83, 61, .28); }
  .btn.ghost { background: #fff; color: var(--ink); box-shadow: inset 0 0 0 2px rgba(42,37,32,.12); height: 52px; font-size: 17px; }
  .btn.ghost:active { box-shadow: inset 0 0 0 2px rgba(42,37,32,.12); }
  .badge {
    display: inline-block; padding: 6px 14px; border-radius: 999px; margin-bottom: 6px;
    background: var(--accent2); color: #fff; font-size: 13px; font-weight: 800; letter-spacing: .04em;
    animation: pop .4s var(--ease);
  }
  @keyframes pop { from { transform: scale(.4); opacity: 0 } to { transform: none; opacity: 1 } }
  .best-line { margin-top: 14px; font-size: 13px; font-weight: 700; color: var(--ink-soft); }
  .share-box {
    margin-top: 8px; padding: 10px 12px; border-radius: 12px; background: rgba(42,37,32,.05);
    font-size: 13px; font-weight: 600; color: var(--ink-soft); text-align: left; user-select: text; -webkit-user-select: text;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <div class="hud">
    <div class="pill" id="scorePill"><small id="scoreLabel">得分</small><span id="score" data-sm="score">0</span></div>
    <div class="pill combo" id="comboPill"><small>连击</small><span id="comboVal">x1</span></div>
    <div class="pill"><small>时间</small><span id="timer">60</span></div>
  </div>
  <div class="combo-track"><i id="comboFill"></i></div>

  <div id="board">
    <div id="flash"></div>
    <div id="basket" aria-hidden="true"></div>
    <div class="toast" id="toast">加速！</div>

    <div id="startScreen" class="overlay">
      <div class="card">
        <h1>接水果</h1>
        <p class="lead">手指左右滑动，接住掉下来的水果。<br><b>连着接住</b>会翻倍，<b>炸弹</b>别碰。</p>
        <p class="best-line hidden" id="startBest"></p>
        <button class="btn" id="startBtn" data-sm="start">开始</button>
        <button class="btn ghost" id="versusBtn">和朋友比一比</button>
      </div>
    </div>

    <div id="prepScreen" class="overlay hidden">
      <div class="card">
        <div class="title" id="prepTitle">玩家 1</div>
        <p class="lead" id="prepText">拿好手机，准备好就点开始。</p>
        <button class="btn" id="prepBtn">开始</button>
      </div>
    </div>

    <div id="overScreen" class="overlay hidden">
      <div class="card">
        <div class="title" id="endTitle">时间到！</div>
        <div class="big" id="finalScore">0</div>
        <div class="stats">
          <span>最高连击<b id="statCombo">0</b></span>
          <span>历史最佳<b id="statBest">0</b></span>
        </div>
        <span class="badge hidden" id="newRecord">新纪录！</span>
        <p id="endHint" class="lead" style="margin:0 0 12px"></p>
        <button class="btn" id="restartBtn" data-sm="restart">再来一局</button>
        <button class="btn ghost" id="shareBtn">复制成绩，发给朋友</button>
        <div class="share-box hidden" id="shareBox"></div>
      </div>
    </div>

    <div id="resultScreen" class="overlay hidden">
      <div class="card">
        <div class="title" id="resultTitle">平局！</div>
        <div class="vs">
          <div class="side" id="p1Side">玩家 1<b id="p1Score">0</b></div>
          <div class="tag">VS</div>
          <div class="side" id="p2Side">玩家 2<b id="p2Score">0</b></div>
        </div>
        <button class="btn" id="againVersusBtn">再来一轮</button>
        <button class="btn ghost" id="backBtn">回主页</button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  // ========== 逻辑区 ==========
  const board = document.getElementById('board');
  const basket = document.getElementById('basket');
  const scoreEl = document.getElementById('score');
  const scoreLabel = document.getElementById('scoreLabel');
  const scorePill = document.getElementById('scorePill');
  const comboPill = document.getElementById('comboPill');
  const comboVal = document.getElementById('comboVal');
  const comboFill = document.getElementById('comboFill');
  const timerEl = document.getElementById('timer');
  const flash = document.getElementById('flash');
  const toast = document.getElementById('toast');
  const screens = { start: startScreen, prep: prepScreen, over: overScreen, result: resultScreen };

  // ---- 参数 ----
  const TOTAL = 60;
  const FRUIT_SIZE = 58, BASKET_W = 104, BASKET_H = 76, BOMB_PENALTY = 3;
  const COMBO_X2 = 5, COMBO_X3 = 12;
  const BEST_KEY = 'saymake.fruitCatch.best';

  // ---- 内联 SVG：写实风的水果、炸弹、篮子（多层渐变 + 高光 + 纹理） ----
  const svg = (inner, w = FRUIT_SIZE, h = FRUIT_SIZE) => `<svg viewBox="0 0 64 64" width="${w}" height="${h}" aria-hidden="true">${inner}</svg>`;
  const defs = (id, stops) => `<radialGradient id="${id}" cx="38%" cy="32%" r="72%">${stops.map(([o, c]) => `<stop offset="${o}" stop-color="${c}"/>`).join('')}</radialGradient>`;
  const shine = (x, y, rx, ry, op, rot) => `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="#fff" opacity="${op}" filter="url(#soft)" transform="rotate(${rot} ${x} ${y})"/>`;
  const pores = (id, color) => `<pattern id="${id}" width="4" height="4" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".55" fill="${color}" opacity=".35"/></pattern>`;
  const STEM = `<path d="M32 16c0-6 1-9 3-12" stroke="#5C3A1E" stroke-width="3" stroke-linecap="round" fill="none"/>`;
  const LEAF = `<linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7BD389"/><stop offset="1" stop-color="#2E8B57"/></linearGradient><path d="M34 7c7-5 14-2 15 3-6 4-12 2-15-3z" fill="url(#lg)"/><path d="M35 9c4-1 8-1 11 0" stroke="#1F6B3A" stroke-width=".8" fill="none" opacity=".6"/>`;
  const applePath = 'M32 14c-4-6-12-6-16-4-10 5-12 20-4 30 5 7 12 11 20 9 8 2 15-2 20-9 8-10 6-25-4-30-4-2-12-2-16 4z';
  const FILTERS = `<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.1"/></filter>`;
  const FRUITS = [
    { id: 'apple', color: '#E0533D', art: FILTERS + defs('ra', [[0, '#FF9A9A'], [.45, '#E5304F'], [1, '#8E1230']]) + LEAF + `<path d="${applePath}" fill="url(#ra)"/><path d="${applePath}" fill="none" stroke="#6E0B22" stroke-opacity=".35" stroke-width="1.2"/>` + shine(23, 26, 6, 9, .55, -30) + shine(40, 22, 2.2, 3.5, .7, -20) + STEM },
    { id: 'orange', color: '#F5921E', art: FILTERS + defs('ro', [[0, '#FFDFA8'], [.5, '#F5921E'], [1, '#B45600']]) + pores('po', '#7a4000') + LEAF + `<circle cx="32" cy="35" r="23" fill="url(#ro)"/><circle cx="32" cy="35" r="23" fill="url(#po)"/><circle cx="32" cy="35" r="23" fill="none" stroke="#7a4000" stroke-opacity=".3"/>` + shine(23, 25, 6, 8, .5, -30) + `<circle cx="32" cy="13" r="2.6" fill="#8A5A2B"/>` },
    { id: 'lemon', color: '#F2C21B', art: FILTERS + defs('rl', [[0, '#FFF7C4'], [.5, '#F2C21B'], [1, '#B88A00']]) + pores('pl', '#8a6500') + `<ellipse cx="32" cy="34" rx="25" ry="18" fill="url(#rl)" transform="rotate(-18 32 34)"/><ellipse cx="32" cy="34" rx="25" ry="18" fill="url(#pl)" transform="rotate(-18 32 34)"/><ellipse cx="32" cy="34" rx="25" ry="18" fill="none" stroke="#8a6500" stroke-opacity=".3" transform="rotate(-18 32 34)"/><ellipse cx="9" cy="28" rx="4.5" ry="3.8" fill="#E0B31A"/><ellipse cx="55" cy="40" rx="4.5" ry="3.8" fill="#E0B31A"/>` + shine(24, 27, 6, 4, .5, -18) },
    { id: 'grape', color: '#9B4DDB', art: FILTERS + defs('rg', [[0, '#E4C9FF'], [.45, '#8E3BD1'], [1, '#3E1068']]) + LEAF + [[24, 22], [40, 22], [16, 36], [32, 36], [48, 36], [24, 50], [40, 50]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="9.5" fill="url(#rg)"/>`).join('') + `<circle cx="21" cy="19" r="2" fill="#fff" opacity=".7" filter="url(#soft)"/><circle cx="13" cy="33" r="1.6" fill="#fff" opacity=".6" filter="url(#soft)"/>` + STEM },
    { id: 'straw', color: '#D7263D', art: FILTERS + defs('rs', [[0, '#FF8E9B'], [.5, '#D7263D'], [1, '#7A0A1C']]) + `<path d="M32 16c10-2 22 4 22 14 0 12-12 22-22 26-10-4-22-14-22-26 0-10 12-16 22-14z" fill="url(#rs)"/>` + [[24, 34], [40, 34], [32, 44], [26, 48], [38, 48], [32, 28]].map(([x, y]) => `<ellipse cx="${x}" cy="${y}" rx="1.5" ry="2.3" fill="#FFE08A" stroke="#7A0A1C" stroke-width=".5"/>`).join('') + `<path d="M18 17l8 2 6-9 6 9 8-2-5 8c-6 3-12 3-18 0z" fill="#3DBE6B"/><path d="M24 18l8 1 8-1" stroke="#1F6B3A" stroke-width=".7" fill="none" opacity=".6"/>` + shine(24, 30, 5, 8, .45, -20) },
  ];
  const BOMB = { id: 'bomb', color: '#2B2B3A', art: FILTERS + defs('rb', [[0, '#8A8A9A'], [.4, '#2E2E3A'], [1, '#0C0C12']]) + `<linearGradient id="cap" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C9C9D4"/><stop offset="1" stop-color="#5A5A68"/></linearGradient><circle cx="32" cy="38" r="22" fill="url(#rb)"/><rect x="26" y="11" width="12" height="9" rx="2" fill="url(#cap)"/><path d="M32 12c0-6 7-9 11-4" stroke="#8A5A2B" stroke-width="3" fill="none" stroke-linecap="round"/><circle class="spark" cx="44" cy="7" r="3.5" fill="#FFB627"/>` + shine(23, 28, 7, 4, .45, -30) + shine(26, 25, 2, 3, .8, -20) };
  const GOLDEN = { id: 'golden', color: '#F2A900', art: FILTERS + defs('rgold', [[0, '#FFFBE0'], [.4, '#F5B400'], [1, '#A66A00']]) + `<path d="${applePath}" fill="url(#rgold)"/><path d="${applePath}" fill="none" stroke="#7A4D00" stroke-opacity=".4" stroke-width="1.2"/>` + shine(23, 26, 6, 9, .8, -30) + shine(40, 22, 2.2, 3.5, .95, -20) + `<path d="M32 16c0-6 1-9 3-12" stroke="#8A5A00" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M50 8l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#fff" opacity=".95"/>` };
  const BASKET_SVG = `<svg viewBox="0 0 80 64" width="${BASKET_W}" height="${BASKET_H}" aria-hidden="true"><defs><linearGradient id="bw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D9A066"/><stop offset="1" stop-color="#8A5A2B"/></linearGradient><pattern id="weave" width="12" height="8" patternUnits="userSpaceOnUse"><rect width="12" height="8" fill="url(#bw)"/><path d="M0 4 Q3 1 6 4 T12 4" stroke="#5C3A1E" stroke-width="1.2" fill="none" opacity=".45"/><path d="M6 0 V8" stroke="#5C3A1E" stroke-width="1" opacity=".3"/></pattern><linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EBC58F"/><stop offset="1" stop-color="#B07A3F"/></linearGradient></defs><path d="M6 16 H74 L64 60 H16 Z" fill="url(#weave)"/><path d="M6 16 H74 L64 60 H16 Z" fill="none" stroke="#4A2E14" stroke-width="1.5" opacity=".5"/><path d="M8 22 Q40 30 72 22" stroke="#000" stroke-width="4" fill="none" opacity=".12"/><ellipse cx="40" cy="16" rx="34" ry="7" fill="url(#rim)"/><ellipse cx="40" cy="16" rx="34" ry="7" fill="none" stroke="#4A2E14" stroke-width="1" opacity=".4"/><ellipse cx="40" cy="17" rx="27" ry="4.5" fill="#3B2410"/><ellipse cx="24" cy="13" rx="12" ry="2.2" fill="#fff" opacity=".45"/></svg>`;
  basket.innerHTML = BASKET_SVG;

  // ---- 状态 ----
  let score = 0, combo = 0, maxCombo = 0, running = false, raf = null;
  let fruits = [], basketX = 0, targetX = 0, squash = 0, catchY = 0, boardW = 0, boardH = 0;
  let elapsed = 0, lastT = 0, spawnIn = 0, shownLeft = -1, phase = 0;
  let mode = 'solo', versus = { p1: null, p2: null, current: 1 };
  let best = { score: 0, combo: 0 };
  try { best = Object.assign(best, JSON.parse(localStorage.getItem(BEST_KEY) || '{}')); } catch (e) { /* 隐私模式读不到，忽略 */ }

  const mult = () => combo >= COMBO_X3 ? 3 : combo >= COMBO_X2 ? 2 : 1;
  const nextThreshold = () => combo < COMBO_X2 ? COMBO_X2 : COMBO_X3;

  // ---- 布局 ----
  function measure() {
    const r = board.getBoundingClientRect();
    boardW = r.width; boardH = r.height;
    catchY = r.height - BASKET_H - 14 - 14;
    if (!basketX) { basketX = targetX = r.width / 2; }
    basketX = clampX(basketX); targetX = clampX(targetX);
    drawBasket();
  }
  function clampX(x) { return Math.max(BASKET_W / 2, Math.min(boardW - BASKET_W / 2, x)); }
  function drawBasket() {
    const s = squash > 0 ? 1 - squash * 1.2 : 1;
    basket.style.transformOrigin = `${BASKET_W / 2}px ${BASKET_H}px`;
    basket.style.transform = `translate(${basketX - BASKET_W / 2}px, ${boardH - BASKET_H - 14}px) scale(${2 - s}, ${s})`;
  }

  // ---- 生成 ----
  function spawn() {
    const golden = elapsed > 8 && Math.random() < 0.06;
    const bomb = !golden && elapsed > 5 && Math.random() < (0.18 + phase * 0.03);
    const type = golden ? GOLDEN : bomb ? BOMB : FRUITS[Math.floor(Math.random() * FRUITS.length)];
    const el = document.createElement('div');
    el.className = 'fruit' + (golden ? ' golden' : '');
    el.innerHTML = svg(type.art);
    board.appendChild(el);
    const x = FRUIT_SIZE / 2 + 12 + Math.random() * (boardW - FRUIT_SIZE - 24);
    const y0 = -FRUIT_SIZE / 2;
    el.animate([{ transform: `translate(${x - FRUIT_SIZE / 2}px, ${y0}px) scale(.4)`, opacity: 0 }, { transform: `translate(${x - FRUIT_SIZE / 2}px, ${y0}px) scale(1)`, opacity: 1 }], { duration: 200, easing: 'cubic-bezier(.2,.9,.3,1.2)' });
    const vy = (210 + Math.random() * 80) * (golden ? 1.35 : 1);
    fruits.push({ el, x, y: y0, vy, type });
  }

  // ---- 反馈 ----
  function burst(x, y, color) {
    for (let i = 0; i < 8; i++) {
      const p = document.createElement('div');
      p.className = 'p'; p.style.background = color;
      p.style.left = (x - 4.5) + 'px'; p.style.top = (y - 4.5) + 'px';
      board.appendChild(p);
      const a = Math.random() * Math.PI * 2, d = 36 + Math.random() * 44;
      p.animate([{ transform: 'translate(0,0) scale(1)', opacity: 1 }, { transform: `translate(${Math.cos(a) * d}px, ${Math.sin(a) * d - 18}px) scale(.2)`, opacity: 0 }], { duration: 600, easing: 'cubic-bezier(.2,.8,.3,1)' }).onfinish = () => p.remove();
    }
  }
  function floatText(x, y, text, cls) {
    const el = document.createElement('div');
    el.className = 'float' + (cls ? ' ' + cls : '');
    el.textContent = text; el.style.left = x + 'px'; el.style.top = y + 'px';
    board.appendChild(el);
    setTimeout(() => el.remove(), 650);
  }
  function bump(pill) { pill.classList.remove('bump'); void pill.offsetWidth; pill.classList.add('bump'); }
  function updateComboUI() {
    const m = mult();
    comboVal.textContent = 'x' + m;
    comboPill.classList.toggle('hot', m > 1);
    const lo = m === 1 ? 0 : COMBO_X2, hi = nextThreshold();
    comboFill.style.width = Math.min(100, ((combo - lo) / (hi - lo)) * 100) + '%';
  }
  function showToast(text) {
    toast.textContent = text;
    toast.animate([{ opacity: 0, transform: 'translateX(-50%) translateY(-8px)' }, { opacity: 1, transform: 'translateX(-50%) translateY(0)' }, { opacity: 1, transform: 'translateX(-50%) translateY(0)', offset: .7 }, { opacity: 0, transform: 'translateX(-50%) translateY(-8px)' }], { duration: 1400, easing: 'ease-out' });
  }
  function show(name) { for (const k in screens) screens[k].classList.toggle('hidden', k !== name); }

  // ---- 判定 ----
  function onCatch(f) {
    if (f.type === BOMB) {
      score = Math.max(0, score - BOMB_PENALTY); combo = 0;
      floatText(f.x, catchY, '-' + BOMB_PENALTY, 'bad'); burst(f.x, catchY, '#3C3C4A');
      flash.classList.remove('on'); void flash.offsetWidth; flash.classList.add('on');
      board.classList.remove('shake'); void board.offsetWidth; board.classList.add('shake');
    } else {
      const m = mult(); combo++;
      const pts = (f.type === GOLDEN ? 5 : 1) * m;
      score += pts;
      floatText(f.x, catchY, '+' + pts);
      burst(f.x, catchY, f.type.color);
      squash = 0.12;
      if (combo === COMBO_X2 || combo === COMBO_X3) showToast('连击 x' + mult() + '！');
      bump(scorePill);
    }
    maxCombo = Math.max(maxCombo, combo);
    scoreEl.textContent = score; updateComboUI();
  }
  function onMiss(f) {
    if (f.type === BOMB) return;
    const near = Math.abs(f.x - basketX) < 72;
    if (combo > 0 || near) floatText(f.x, boardH - 90, near ? '就差一点' : '连击断了', 'miss');
    combo = 0; updateComboUI();
  }

  // ---- 主循环 ----
  function loop(t) {
    if (!running) return;
    const dt = Math.min(0.05, (t - lastT) / 1000 || 0);
    lastT = t; elapsed += dt;
    const speedUp = 1 + (elapsed / TOTAL) * 1.2;

    basketX += (targetX - basketX) * Math.min(1, dt * 14);
    squash = Math.max(0, squash - dt * 1.2);
    drawBasket();

    const ph = Math.min(3, Math.floor(elapsed / 15));
    if (ph !== phase) { phase = ph; showToast(ph === 3 ? '最后 20 秒' : '加速！'); }

    spawnIn -= dt;
    if (spawnIn <= 0) { spawn(); spawnIn = Math.max(0.45, 0.95 - (elapsed / TOTAL) * 0.4); }

    for (let i = fruits.length - 1; i >= 0; i--) {
      const f = fruits[i];
      f.y += f.vy * speedUp * dt;
      f.el.style.transform = `translate(${f.x - FRUIT_SIZE / 2}px, ${f.y}px)`;
      const caught = Math.abs(f.x - basketX) <= (BASKET_W / 2 + FRUIT_SIZE / 2 - 12);
      if (caught && f.y + FRUIT_SIZE / 2 >= catchY) { onCatch(f); f.el.remove(); fruits.splice(i, 1); }
      else if (f.y - FRUIT_SIZE / 2 > boardH) { onMiss(f); f.el.remove(); fruits.splice(i, 1); }
    }

    const left = Math.max(0, TOTAL - Math.floor(elapsed));
    if (left !== shownLeft) { shownLeft = left; timerEl.textContent = left; }
    if (elapsed >= TOTAL) return end();
    raf = requestAnimationFrame(loop);
  }

  function clearFruits() { fruits.forEach(f => f.el.remove()); fruits = []; }
  function showBestLine() {
    const el = document.getElementById('startBest');
    if (best.score > 0) { el.textContent = '历史最佳 ' + best.score + ' 分 · 最高连击 ' + best.combo; el.classList.remove('hidden'); }
  }

  // ---- 模式 ----
  function start() {
    clearFruits();
    score = 0; combo = 0; maxCombo = 0; elapsed = 0; spawnIn = 0.35; shownLeft = -1; phase = 0; running = true;
    scoreEl.textContent = '0'; timerEl.textContent = TOTAL; updateComboUI();
    scoreLabel.textContent = mode === 'versus' ? '玩家 ' + versus.current : '得分';
    show(null);
    measure();
    lastT = performance.now();
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(loop);
  }
  function end() {
    running = false; cancelAnimationFrame(raf); clearFruits();
    const isRecord = score > best.score && score > 0;
    if (isRecord) { best = { score, combo: Math.max(maxCombo, best.combo) }; try { localStorage.setItem(BEST_KEY, JSON.stringify(best)); } catch (e) { /* 忽略 */ } }
    if (mode === 'versus') { endVersus(); return; }
    document.getElementById('endTitle').textContent = score >= 60 ? '手速可以！' : score >= 25 ? '时间到！' : '再来一把？';
    document.getElementById('finalScore').textContent = score;
    document.getElementById('statCombo').textContent = maxCombo;
    document.getElementById('statBest').textContent = best.score;
    document.getElementById('newRecord').classList.toggle('hidden', !isRecord);
    const hint = document.getElementById('endHint');
    hint.textContent = isRecord ? '刷新了自己的纪录' : best.score > 0 ? '差 ' + (best.score - score + 1) + ' 分破纪录，连击不断能翻倍' : '连着接住 5 个，分数翻倍';
    document.getElementById('shareBox').classList.add('hidden');
    document.getElementById('shareBtn').textContent = '复制成绩，发给朋友';
    show('over');
  }
  function startVersus() {
    mode = 'versus'; versus = { p1: null, p2: null, current: 1 };
    document.getElementById('prepTitle').textContent = '玩家 1';
    document.getElementById('prepText').textContent = '拿好手机，准备好就点开始。玩完传给玩家 2。';
    show('prep');
  }
  function endVersus() {
    if (versus.current === 1) {
      versus.p1 = { score, combo: maxCombo };
      versus.current = 2;
      document.getElementById('prepTitle').textContent = '玩家 2';
      document.getElementById('prepText').textContent = '玩家 1 拿了 ' + versus.p1.score + ' 分。轮到你了。';
      show('prep');
    } else {
      versus.p2 = { score, combo: maxCombo };
      const a = versus.p1.score, b = versus.p2.score;
      document.getElementById('resultTitle').textContent = a === b ? '平局，再来一轮？' : (a > b ? '玩家 1 赢了！' : '玩家 2 赢了！');
      document.getElementById('p1Score').textContent = a;
      document.getElementById('p2Score').textContent = b;
      document.getElementById('p1Side').classList.toggle('win', a > b);
      document.getElementById('p2Side').classList.toggle('win', b > a);
      show('result');
    }
  }
  function backToStart() { mode = 'solo'; scoreLabel.textContent = '得分'; show('start'); showBestLine(); }
  function restart() { mode === 'versus' ? startVersus() : start(); }
  function getScore() { return score; }
  function isRunning() { return running; }

  async function share() {
    const text = `我在《接水果》拿了 ${score} 分，最高连击 ${maxCombo} 个。来挑战我！`;
    const box = document.getElementById('shareBox');
    try { await navigator.clipboard.writeText(text); document.getElementById('shareBtn').textContent = '已复制，去粘贴给朋友'; }
    catch (e) { box.textContent = text; box.classList.remove('hidden'); document.getElementById('shareBtn').textContent = '长按上面的文字复制'; }
  }

  // ---- 输入 ----
  function pointTo(e) { const r = board.getBoundingClientRect(); targetX = clampX(e.clientX - r.left); }
  board.addEventListener('pointerdown', pointTo);
  board.addEventListener('pointermove', (e) => { if (e.buttons || e.pointerType === 'touch') pointTo(e); });
  window.addEventListener('resize', measure);

  document.getElementById('startBtn').addEventListener('click', () => { mode = 'solo'; start(); });
  document.getElementById('versusBtn').addEventListener('click', startVersus);
  document.getElementById('prepBtn').addEventListener('click', start);
  document.getElementById('restartBtn').addEventListener('click', restart);
  document.getElementById('shareBtn').addEventListener('click', share);
  document.getElementById('againVersusBtn').addEventListener('click', startVersus);
  document.getElementById('backBtn').addEventListener('click', backToStart);
  measure(); showBestLine();

  // 契约：验收器依赖这四个方法
  window.__sm = { start, restart, getScore, isRunning };
})();
</script>
</body>
</html>
